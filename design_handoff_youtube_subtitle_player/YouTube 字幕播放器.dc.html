<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #eceef1; font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Helvetica Neue", sans-serif; }
    a { color: #e0453f; }
    a:hover { color: #c73832; }
  </style>
</helmet>


<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
  <div style="{{ winStyle }}">

    <div style="{{ titlebarStyle }}">
      <x-import component-from-global-scope="MacTrafficLights" from="./macos-window.jsx" hint-size="60,14"></x-import>
      <div style="{{ titleTextStyle }}">YouTube 字幕播放器</div>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:6px" onClick="{{ toggleDark }}">
        <span style="{{ darkModeLabelStyle }}">深色</span>
        <div style="{{ darkToggleTrackStyle }}"><div style="{{ darkToggleThumbStyle }}"></div></div>
      </div>
      <form style="display:flex;align-items:center;gap:8px" onSubmit="{{ onUrlSubmit }}">
        <div style="{{ urlPillStyle }}">
          <div style="width:16px;height:11px;border-radius:3px;background:#e0453f;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <div style="width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:5px solid #fff;margin-left:1px"></div>
          </div>
          <input type="text" value="{{ urlInput }}" onChange="{{ onUrlChange }}" placeholder="貼上 YouTube 影片連結…" style="{{ urlInputStyle }}" />
        </div>
        <button type="submit" style="border:none;background:#e0453f;color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer">載入</button>
      </form>
    </div>

    <sc-if value="{{ showMeta }}" hint-placeholder-val="{{ true }}">
    <div style="padding:14px 20px 6px">
      <div style="{{ videoTitleStyle }}">{{ videoTitle }}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <div style="width:32px;height:32px;border-radius:50%;background:#3a3a3c;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{ channelInitial }}</div>
        <div style="{{ channelTextStyle }}">{{ channelName }}</div>
        <div style="flex:1"></div>
      </div>
    </div>
    </sc-if>

    <div style="{{ videoWrapStyle }}">
      <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0.03) 0 2px,transparent 2px 14px)"></div>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,0.35)">
        <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:1px">YOUTUBE 影片畫面</div>
        <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px">預覽用佔位畫面</div>
      </div>

      <sc-if value="{{ showPlayOverlay }}">
        <div onClick="{{ togglePlay }}" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer">
          <div style="width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;backdropFilter:blur(6px)">
            <div style="width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:20px solid #fff;margin-left:5px"></div>
          </div>
        </div>
      </sc-if>

      <div style="position:absolute;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 24px;pointer-events:none">
        <sc-if value="{{ subJP }}" hint-placeholder-val="{{ true }}">
          <div style="{{ jpTextStyle }}">{{ cueJP }}</div>
        </sc-if>
        <sc-if value="{{ subCN }}" hint-placeholder-val="{{ true }}">
          <div style="{{ cnTextStyle }}">{{ cueCN }}</div>
        </sc-if>
        <sc-if value="{{ subRomaji }}" hint-placeholder-val="{{ true }}">
          <div style="{{ romajiTextStyle }}">{{ cueRomaji }}</div>
        </sc-if>
      </div>
    </div>

    <div style="margin:14px 20px 20px;display:flex;flex-direction:column;gap:10px;position:relative">

      <div style="position:relative;padding-top:14px">
        <sc-if value="{{ hoverInfo }}">
          <div style="{{ hoverTooltipStyle }}">
            <div style="font-size:11px;font-weight:600;color:#fff">{{ hoverInfo.time }}</div>
            <sc-if value="{{ hoverInfo.jp }}"><div style="font-size:11px;color:rgba(255,255,255,0.85);margin-top:2px">{{ hoverInfo.jp }}</div></sc-if>
          </div>
        </sc-if>
        <div style="{{ trackStyle }}" onPointerDown="{{ onScrubDown }}" onPointerMove="{{ onScrubMove }}" onPointerUp="{{ onScrubUp }}" onPointerLeave="{{ onScrubLeave }}">
          <div style="{{ fillStyle }}"></div>
          <div style="{{ thumbStyle }}"></div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:14px">
        <button onClick="{{ togglePlay }}" style="width:34px;height:34px;border-radius:50%;border:none;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">
          <sc-if value="{{ isPlaying }}">
            <div style="display:flex;gap:3px">
              <div style="width:3px;height:12px;background:#fff;borderRadius:1px"></div>
              <div style="width:3px;height:12px;background:#fff;borderRadius:1px"></div>
            </div>
          </sc-if>
          <sc-if value="{{ notPlaying }}">
            <div style="width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid #fff;margin-left:2px"></div>
          </sc-if>
        </button>

        <div style="{{ timeTextStyle }}">{{ timeLabel }}</div>

        <div style="display:flex;align-items:center;gap:6px;margin-left:4px">
          <button onClick="{{ toggleMute }}" style="{{ volumeIconStyle }}">{{ volumeIcon }}</button>
          <input type="range" min="0" max="100" value="{{ volume }}" onChange="{{ onVolumeChange }}" style="width:70px;accentColor:#e0453f" />
        </div>

        <div style="flex:1"></div>

        <div style="display:flex;align-items:center;gap:6px">
          <button onClick="{{ toggleJP }}" style="{{ chipStyleJP }}">日</button>
          <button onClick="{{ toggleCN }}" style="{{ chipStyleCN }}">中</button>
          <button onClick="{{ toggleRomaji }}" style="{{ chipStyleRomaji }}">拼</button>
        </div>

        <button onClick="{{ toggleTheater }}" style="{{ theaterButtonStyle }}">劇院模式</button>

        <div style="position:relative">
          <button onClick="{{ toggleSettings }}" style="{{ gearButtonStyle }}">⚙</button>
          <sc-if value="{{ showSettings }}">
            <div style="position:absolute;bottom:38px;right:0;z-index:5;width:230px">
              <x-import component-from-global-scope="MacGlass" from="./macos-window.jsx" radius="14" dark="{{ isDark }}" hint-size="230,280">
                <div style="padding:14px;display:flex;flex-direction:column;gap:12px">
                  <div style="{{ popoverHeadingStyle }}">播放設定</div>
                  <div>
                    <div style="{{ popoverLabelStyle }}">播放速率</div>
                    <div style="display:flex;align-items:center;gap:2px;border-radius:8px;padding:2px">
                      <sc-for list="{{ speedOptions }}" as="opt" hint-placeholder-count="5">
                        <button onClick="{{ opt.onClick }}" style="{{ opt.style }}">{{ opt.label }}</button>
                      </sc-for>
                    </div>
                  </div>
                  <div style="{{ popoverHeadingStyle }}">字幕樣式</div>
                  <div>
                    <div style="{{ popoverLabelStyle }}">字級大小</div>
                    <input type="range" min="0.7" max="1.6" step="0.05" value="{{ fontScale }}" onChange="{{ onFontScaleChange }}" style="width:100%;accentColor:#e0453f" />
                  </div>
                  <div>
                    <div style="{{ popoverLabelStyle }}">日文字幕顏色</div>
                    <div style="display:flex;gap:8px">
                      <sc-for list="{{ colorSwatches }}" as="sw" hint-placeholder-count="4">
                        <button onClick="{{ sw.onClick }}" style="{{ sw.style }}"></button>
                      </sc-for>
                    </div>
                  </div>
                  <div style="{{ sourceNoteStyle }}">字幕來源：本地 Whisper 辨識＋翻譯 API（示範資料）</div>
                </div>
              </x-import>
            </div>
          </sc-if>
        </div>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1040, &quot;height&quot;: 760},
  &quot;initialSpeed&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;options&quot;: [0.5, 1, 1.25, 1.5, 2], &quot;section&quot;: &quot;播放設定&quot;},
  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#e0453f&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#e0453f&quot;, &quot;#3478f6&quot;, &quot;#34a853&quot;, &quot;#f5a623&quot;], &quot;section&quot;: &quot;外觀&quot;},
  &quot;romajiDefaultOn&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;字幕設定&quot;}
}">
const DURATION = 138;
const CAPTIONS = [
  { start: 3, end: 7.5, jp: 'こんにちは、今日はいい天気ですね', cn: '你好，今天天氣真好呢', romaji: 'Konnichiwa, kyou wa ii tenki desu ne' },
  { start: 9, end: 13.5, jp: '最近何か面白いことありましたか？', cn: '最近有發生什麼有趣的事嗎？', romaji: 'Saikin nanika omoshiroi koto arimashita ka?' },
  { start: 16, end: 20, jp: '実は新しいカフェを見つけたんです', cn: '其實我發現了一家新咖啡廳', romaji: 'Jitsu wa atarashii kafe wo mitsuketan desu' },
  { start: 23, end: 27.5, jp: 'そこのコーヒーが本当に美味しいですよ', cn: '那裡的咖啡真的很好喝喔', romaji: 'Soko no koohii ga hontou ni oishii desu yo' },
  { start: 30, end: 34, jp: '今度一緒に行ってみませんか', cn: '下次要不要一起去看看', romaji: 'Kondo issho ni itte mimasen ka' },
  { start: 37, end: 41.5, jp: 'ぜひ行きたいです、楽しみにしてます', cn: '我很想去，很期待呢', romaji: 'Zehi ikitai desu, tanoshimi ni shitemasu' },
  { start: 52, end: 56.5, jp: 'ところで週末は何をする予定ですか', cn: '對了，你週末打算做什麼呢', romaji: 'Tokorode shuumatsu wa nani wo suru yotei desu ka' },
  { start: 59, end: 63, jp: '友達と映画を見に行くつもりです', cn: '我打算和朋友去看電影', romaji: 'Tomodachi to eiga wo mi ni iku tsumori desu' },
  { start: 78, end: 82.5, jp: 'それは楽しそうですね、何を見るんですか', cn: '聽起來很有趣呢，要看什麼片子', romaji: 'Sore wa tanoshisou desu ne, nani wo miru n desu ka' },
  { start: 85, end: 89, jp: 'まだ決めていないので一緒に選びましょう', cn: '還沒決定，一起來選吧', romaji: 'Mada kimeteinai node issho ni erabimashou' },
];

function fmt(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}
function getCue(t) {
  return CAPTIONS.find(function (c) { return t >= c.start && t < c.end; }) || null;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      isPlaying: false,
      currentTime: 0,
      hoverInfo: null,
      volume: 70,
      lastVolume: 70,
      speed: props.initialSpeed || 1,
      subJP: true,
      subCN: true,
      subRomaji: props.romajiDefaultOn !== false,
      showSettings: false,
      fontScale: 1,
      jpColor: props.accentColor ? '#ffffff' : '#ffffff',
      urlInput: '',
      videoTitle: '日常閒聊：巷口新開的咖啡廳',
      channelName: '日常VLOG頻道',
      subscribed: false,
      darkMode: false,
      theaterMode: false,
    };
    this._dragging = false;
  }

  componentDidMount() {
    this._timer = setInterval(function () {
      this.setState(function (s) {
        if (!s.isPlaying) return null;
        const next = s.currentTime + 0.1 * s.speed;
        if (next >= DURATION) return { currentTime: DURATION, isPlaying: false };
        return { currentTime: next };
      });
    }.bind(this), 100);
  }
  componentWillUnmount() {
    clearInterval(this._timer);
  }

  seekFromEvent(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    return pct;
  }

  renderVals() {
    const accent = this.props.accentColor || '#e0453f';
    const s = this.state;
    const cue = getCue(s.currentTime);
    const pct = (s.currentTime / DURATION) * 100;

    const onScrubDown = function (e) {
      e.currentTarget.setPointerCapture(e.pointerId);
      this._dragging = true;
      const pct = this.seekFromEvent(e);
      this.setState({ currentTime: pct * DURATION });
    }.bind(this);
    const onScrubMove = function (e) {
      const pct = this.seekFromEvent(e);
      const t = pct * DURATION;
      const c = getCue(t);
      this.setState({ hoverInfo: { time: fmt(t), jp: c ? c.jp : null, pct: pct * 100 } });
      if (this._dragging) this.setState({ currentTime: t });
    }.bind(this);
    const onScrubUp = function (e) {
      this._dragging = false;
    }.bind(this);
    const onScrubLeave = function () {
      if (!this._dragging) this.setState({ hoverInfo: null });
    }.bind(this);

    const togglePlay = function () {
      this.setState(function (s) {
        if (s.currentTime >= DURATION) return { isPlaying: true, currentTime: 0 };
        return { isPlaying: !s.isPlaying };
      });
    }.bind(this);

    const toggleMute = function () {
      this.setState(function (s) {
        if (s.volume > 0) return { volume: 0, lastVolume: s.volume };
        return { volume: s.lastVolume || 70 };
      });
    }.bind(this);
    const onVolumeChange = function (e) {
      this.setState({ volume: Number(e.target.value) });
    }.bind(this);

    const toggleJP = function () { this.setState(function (s) { return { subJP: !s.subJP }; }); }.bind(this);
    const toggleCN = function () { this.setState(function (s) { return { subCN: !s.subCN }; }); }.bind(this);
    const toggleRomaji = function () { this.setState(function (s) { return { subRomaji: !s.subRomaji }; }); }.bind(this);
    const toggleSettings = function () { this.setState(function (s) { return { showSettings: !s.showSettings }; }); }.bind(this);
    const onFontScaleChange = function (e) { this.setState({ fontScale: Number(e.target.value) }); }.bind(this);
    const toggleSubscribe = function () { this.setState(function (s) { return { subscribed: !s.subscribed }; }); }.bind(this);
    const onUrlChange = function (e) { this.setState({ urlInput: e.target.value }); }.bind(this);
    const toggleDark = function () { this.setState(function (s) { return { darkMode: !s.darkMode }; }); }.bind(this);
    const toggleTheater = function () { this.setState(function (s) { return { theaterMode: !s.theaterMode }; }); }.bind(this);
    const dark = s.darkMode;
    const theme = {
      winBg: dark ? '#1e1e20' : '#ffffff',
      border: dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)',
      textPrimary: dark ? 'rgba(255,255,255,0.92)' : 'rgba(0,0,0,0.88)',
      textSecondary: dark ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.55)',
      textTertiary: dark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.45)',
      chipInactiveBg: dark ? 'rgba(255,255,255,0.1)' : '#f2f2f4',
      chipInactiveText: dark ? 'rgba(255,255,255,0.65)' : 'rgba(0,0,0,0.55)',
      segmentBg: dark ? 'rgba(255,255,255,0.08)' : '#f2f2f4',
      segmentActiveBg: dark ? 'rgba(255,255,255,0.18)' : '#ffffff',
      segmentActiveText: dark ? '#ffffff' : 'rgba(0,0,0,0.85)',
      urlPillBg: dark ? 'rgba(255,255,255,0.08)' : '#f2f2f4',
      trackBg: dark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.09)',
    };
    const onUrlSubmit = function (e) {
      e.preventDefault();
      this.setState(function (s) {
        const titles = ['日常閒聊：巷口新開的咖啡廳', '東京街頭採訪：你今天過得如何？', '週末Vlog：和朋友去看電影'];
        const next = titles[(titles.indexOf(s.videoTitle) + 1) % titles.length];
        return { videoTitle: next, currentTime: 0, isPlaying: false, urlInput: '' };
      });
    }.bind(this);

    const chip = function (active, onClick) {
      return {
        onClick: onClick,
        style: {
          border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600,
          padding: '6px 10px', borderRadius: 7,
          background: active ? accent : theme.chipInactiveBg,
          color: active ? '#fff' : theme.chipInactiveText,
        },
      };
    };
    const jpChip = chip(s.subJP, toggleJP);
    const cnChip = chip(s.subCN, toggleCN);
    const roChip = chip(s.subRomaji, toggleRomaji);

    const speedOptions = [0.5, 1, 1.25, 1.5, 2].map(function (v) {
      const active = s.speed === v;
      return {
        label: v + 'x',
        onClick: function () { this.setState({ speed: v }); }.bind(this),
        style: {
          border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600,
          padding: '8px 10px', borderRadius: 7,
          background: active ? theme.segmentActiveBg : theme.segmentBg,
          color: active ? theme.segmentActiveText : theme.textTertiary,
          boxShadow: active ? '0 1px 2px rgba(0,0,0,0.15)' : 'none',
        },
      };
    }.bind(this));

    const swatchColors = ['#ffffff', '#ffe9a8', '#a8e6ff', '#b8f2c9'];
    const colorSwatches = swatchColors.map(function (c) {
      return {
        onClick: function () { this.setState({ jpColor: c }); }.bind(this),
        style: {
          width: 24, height: 24, borderRadius: '50%', cursor: 'pointer',
          background: c, border: s.jpColor === c ? '2px solid ' + accent : '1px solid rgba(0,0,0,0.15)',
        },
      };
    }.bind(this));

    return {
      winStyle: { background: theme.winBg, width: s.theaterMode ? '1280px' : '1040px', maxWidth: '100%', borderRadius: 20, overflow: 'hidden', boxShadow: '0 0 0 1px rgba(0,0,0,0.12),0 24px 60px rgba(0,0,0,0.28)', display: 'flex', flexDirection: 'column', fontFamily: "-apple-system,BlinkMacSystemFont,'SF Pro','Helvetica Neue',sans-serif" },
      titlebarStyle: { borderBottom: '1px solid ' + theme.border, display: 'flex', alignItems: 'center', gap: 14, padding: '12px 16px', flexShrink: 0 },
      titleTextStyle: { color: theme.textPrimary, fontSize: 13, fontWeight: 700, whiteSpace: 'nowrap', flexShrink: 0 },
      videoTitleStyle: { color: theme.textPrimary, fontSize: 18, fontWeight: 700, lineHeight: 1.3 },
      channelTextStyle: { color: theme.textSecondary, fontSize: 13, fontWeight: 600 },
      viewsTextStyle: { color: theme.textTertiary, fontSize: 12, whiteSpace: 'nowrap', flexShrink: 0 },
      timeTextStyle: { color: theme.textSecondary, fontSize: 12, fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap' },
      urlPillStyle: { background: theme.urlPillBg, display: 'flex', alignItems: 'center', gap: 6, borderRadius: 8, padding: '6px 10px', width: 280 },
      urlInputStyle: { color: theme.textPrimary, border: 'none', background: 'transparent', outline: 'none', fontSize: 12, flex: 1, minWidth: 0 },
      trackStyle: { position: 'relative', height: 6, borderRadius: 3, background: theme.trackBg, cursor: 'pointer' },
      gearButtonStyle: { width: 30, height: 30, borderRadius: 8, border: 'none', background: s.showSettings ? theme.chipInactiveBg : 'transparent', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: theme.textSecondary, fontSize: 15 },
      popoverHeadingStyle: { fontSize: 12, fontWeight: 700, color: theme.textPrimary },
      popoverLabelStyle: { fontSize: 11, color: theme.textTertiary, marginBottom: 6 },
      sourceNoteStyle: { fontSize: 10, color: theme.textTertiary, borderTop: '1px solid ' + theme.border, paddingTop: 8 },
      volumeIconStyle: { border: 'none', background: 'transparent', cursor: 'pointer', padding: 2, fontSize: 14, color: theme.textSecondary },
      darkToggleTrackStyle: { width: 40, height: 22, borderRadius: 11, background: dark ? accent : theme.chipInactiveBg, position: 'relative', cursor: 'pointer', transition: 'background 0.15s' },
      darkToggleThumbStyle: { position: 'absolute', top: 2, left: dark ? 20 : 2, width: 18, height: 18, borderRadius: '50%', background: '#fff', boxShadow: '0 1px 2px rgba(0,0,0,0.3)', transition: 'left 0.15s' },
      toggleDark: toggleDark,
      darkModeLabelStyle: { fontSize: 12, color: theme.textSecondary, whiteSpace: 'nowrap', flexShrink: 0 },
      theaterButtonStyle: { border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600, padding: '7px 12px', borderRadius: 7, background: s.theaterMode ? accent : theme.chipInactiveBg, color: s.theaterMode ? '#fff' : theme.chipInactiveText },
      toggleTheater: toggleTheater,
      theaterMode: s.theaterMode,
      showMeta: !s.theaterMode,
      isDark: dark,
      videoWrapStyle: { margin: s.theaterMode ? '12px 0 0' : '12px 20px 0', position: 'relative', borderRadius: s.theaterMode ? 0 : 12, overflow: 'hidden', background: '#0b0b0c', aspectRatio: '16/9' },

      videoTitle: s.videoTitle,
      channelName: s.channelName,
      channelInitial: s.channelName.charAt(0),
      subscribed: s.subscribed,
      subscribeLabel: s.subscribed ? '已訂閱' : '訂閱',
      subscribeButtonStyle: {
        border: 'none', cursor: 'pointer', fontSize: 12, fontWeight: 600,
        padding: '6px 12px', borderRadius: 16,
        background: s.subscribed ? theme.chipInactiveBg : (dark ? '#f2f2f4' : '#1c1c1e'),
        color: s.subscribed ? theme.textSecondary : (dark ? '#1c1c1e' : '#fff'),
      },
      urlInput: s.urlInput,
      onUrlChange: onUrlChange,
      onUrlSubmit: onUrlSubmit,
      toggleSubscribe: toggleSubscribe,

      isPlaying: s.isPlaying,
      notPlaying: !s.isPlaying,
      showPlayOverlay: !s.isPlaying,
      togglePlay: togglePlay,
      timeLabel: fmt(s.currentTime) + ' / ' + fmt(DURATION),

      cueJP: cue ? cue.jp : '',
      cueCN: cue ? cue.cn : '',
      cueRomaji: cue ? cue.romaji : '',
      subJP: s.subJP, subCN: s.subCN, subRomaji: s.subRomaji,
      jpTextStyle: { fontFamily: "'Noto Sans JP',sans-serif", fontWeight: 700, fontSize: 30 * s.fontScale, color: s.jpColor, textShadow: '0 2px 6px rgba(0,0,0,0.6)', textAlign: 'center', lineHeight: 1.3 },
      cnTextStyle: { fontFamily: "'Noto Sans TC',sans-serif", fontWeight: 500, fontSize: 19 * s.fontScale, color: 'rgba(255,255,255,0.82)', textShadow: '0 2px 5px rgba(0,0,0,0.6)', textAlign: 'center', lineHeight: 1.3 },
      romajiTextStyle: { fontFamily: "-apple-system,sans-serif", fontStyle: 'italic', fontWeight: 400, fontSize: 14 * s.fontScale, color: 'rgba(255,255,255,0.55)', letterSpacing: 0.3, textAlign: 'center' },

      onScrubDown: onScrubDown, onScrubMove: onScrubMove, onScrubUp: onScrubUp, onScrubLeave: onScrubLeave,
      fillStyle: { position: 'absolute', top: 0, left: 0, bottom: 0, width: pct + '%', background: accent, borderRadius: 3 },
      thumbStyle: { position: 'absolute', top: '50%', left: pct + '%', width: 12, height: 12, marginTop: -6, marginLeft: -6, borderRadius: '50%', background: '#fff', boxShadow: '0 1px 3px rgba(0,0,0,0.4)' },
      hoverInfo: s.hoverInfo,
      hoverTooltipStyle: s.hoverInfo ? { position: 'absolute', bottom: 20, left: s.hoverInfo.pct + '%', transform: 'translateX(-50%)', background: 'rgba(0,0,0,0.85)', borderRadius: 8, padding: '8px 12px', pointerEvents: 'none', whiteSpace: 'nowrap' } : {},

      volumeIcon: s.volume === 0 ? '🔇' : s.volume < 50 ? '🔉' : '🔊',
      volume: s.volume, onVolumeChange: onVolumeChange, toggleMute: toggleMute,

      chipStyleJP: jpChip.style, toggleJP: jpChip.onClick,
      chipStyleCN: cnChip.style, toggleCN: cnChip.onClick,
      chipStyleRomaji: roChip.style, toggleRomaji: roChip.onClick,

      speedOptions: speedOptions,

      showSettings: s.showSettings, toggleSettings: toggleSettings,
      settingsBg: s.showSettings ? '#f2f2f4' : 'transparent',
      fontScale: s.fontScale, onFontScaleChange: onFontScaleChange,
      colorSwatches: colorSwatches,
    };
  }
}
</script>
</body>
</html>
