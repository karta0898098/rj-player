[package]
name = "rj-player-desktop"
version = "0.1.0"
description = "rj-player desktop shell (Tauri v2) — embeds the axum backend and serves the same frontend/ SPA"
authors = ["Ray Chang"]
license = ""
repository = "https://github.com/karta0898098/rj-player"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is needed for Windows (a bin and lib can't share a name);
# `main.rs` calls `app_lib::run()`.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# Platform detection helper (kept for the deferred Windows caption-button work).
tauri-plugin-os = "2"
# Native "Save as…" dialog for subtitle export (SRT/LRC/TXT). The browser
# `<a download>` + Blob path silently no-ops inside WKWebView, so on desktop
# the export goes through a native save panel + file write instead (used from
# the Rust side only in `save_text_file`, so no JS dialog ACL is needed).
tauri-plugin-dialog = "2"
# The backend library (dsd.md §13): this desktop shell is a *second* consumer
# of the exact same server code the standalone `./dev.sh` binary uses — it does
# not fork or reimplement anything.
rj-player-backend = { path = "../backend" }
# OS keychain for the LLM API key (dsd.md §13.6): stored in the macOS Keychain,
# never in plaintext config. `apple-native` uses the Security framework.
keyring = { version = "3", features = ["apple-native"] }
