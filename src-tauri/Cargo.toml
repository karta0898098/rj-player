[package]
name = "rj-player-desktop"
version = "0.1.4"
description = "rj-player desktop shell (Tauri v2) — embeds the axum backend and serves the same frontend/ SPA"
authors = ["Ray Chang"]
license = ""
repository = "https://github.com/karta0898098/rj-player"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix is needed for Windows (a bin and lib can't share a name);
# `main.rs` calls `app_lib::run()`.
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `macos-private-api` drives the transparent / overlay-titlebar window on macOS
# (see lib.rs). It MUST be declared here in the base deps, not a target table:
# tauri-build reads the manifest to match it against `macOSPrivateApi` in
# tauri.conf.json and only looks at `[dependencies]`. The feature is a no-op on
# Windows/Linux (Tauri gates the private-API code behind cfg(target_os=macos)),
# so it stays cross-platform.
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
# Platform detection helper (kept for the deferred Windows caption-button work).
tauri-plugin-os = "2"
# Native "Save as…" dialog for subtitle export (SRT/LRC/TXT). The browser
# `<a download>` + Blob path silently no-ops inside WKWebView, so on desktop
# the export goes through a native save panel + file write instead (used from
# the Rust side only in `save_text_file`, so no JS dialog ACL is needed).
tauri-plugin-dialog = "2"
# The backend library (dsd.md §13): this desktop shell is a *second* consumer
# of the exact same server code the standalone `./dev.sh` binary uses — it does
# not fork or reimplement anything.
rj-player-backend = { path = "../backend" }
# OS keychain for the LLM API key (dsd.md §13.6): stored in the OS credential
# store, never in plaintext config. The backend uses the same `keyring` API on
# every platform; only the native backend feature differs per target (below).

# macOS: Keychain via the Security framework.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Windows: Credential Manager via the Windows-native backend.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Linux (split/dev deploy hosts): Secret Service via the sync-secret-service
# backend, so no async runtime feature is required.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
